# Every technical term in Stack Quest. Lessons link to these with
#   <Term word="file-path">file path</Term>
# Keep definitions to one or two plain sentences, and give an everyday example.

- id: api
  term: API
  definition: Short for "application programming interface". A set of agreed requests one program can make to another, like a menu that lists what you can order.
  example: A weather app asks a weather API "what's the forecast for Durban?" and gets an answer back.

- id: browser
  term: Browser
  definition: The program you use to visit websites, such as Chrome or Safari. It downloads web pages and draws them on your screen.
  example: You're reading this in a browser right now.

- id: bug
  term: Bug
  definition: A mistake in code that makes a program do something different from what was intended.
  example: A shop's checkout adds VAT twice. That's a bug.

- id: code
  term: Code
  definition: Instructions for a computer, written in a programming language that humans can read.
  example: "console.log(\"Hello\") is a line of JavaScript code."

- id: console
  term: Console
  definition: A text area where a program can print messages. Developers use it to see what their code is doing.
  example: "console.log(2 + 2) prints 4 in the console."

- id: css
  term: CSS
  definition: Short for "Cascading Style Sheets". The language that controls how a web page looks, including colours, sizes, spacing and layout.
  example: "h1 { color: green; } makes every main heading green."

- id: database
  term: Database
  definition: An organised place to store information so it can be found, changed and searched quickly.
  example: A bank's database holds every account and every transaction.

- id: error-message
  term: Error message
  definition: A message a program shows when it can't do what it was asked. It's a clue, not a telling-off. It usually says what went wrong and where.
  example: "ReferenceError: total is not defined means the code used a name it doesn't know."

- id: file
  term: File
  definition: One named bundle of information kept in storage, such as a photo, a song or a document.
  example: holiday.jpg is a file.

- id: file-path
  term: File path
  definition: The full address of a file. It lists every folder you go through to reach it, separated by / slashes.
  example: /Users/thandi/Documents/cv.pdf

- id: folder
  term: Folder
  definition: A container for files and other folders. Also called a directory.
  example: Your Documents folder.

- id: framework
  term: Framework
  definition: A ready-made skeleton for building a type of program, with rules about where things go so you don't start from scratch.
  example: Stack Quest is built with the Next.js framework.

- id: frontmatter
  term: Frontmatter
  definition: A small block of facts at the top of a file, between two --- lines, that describes the file.
  example: "Each Stack Quest lesson starts with frontmatter such as title: and minutes:."

- id: function
  term: Function
  definition: A named, reusable set of instructions. You give it some inputs, and it does a job and often hands back a result.
  example: "xpForCompletion(10, 0) is a function call that hands back 15."

- id: html
  term: HTML
  definition: Short for "HyperText Markup Language". The language that describes what's on a web page, such as headings, paragraphs, images and links.
  example: "<h1>Hello</h1> is HTML for a main heading."

- id: javascript
  term: JavaScript
  definition: The programming language that runs in every web browser. It makes pages interactive, and with Node.js it can also run on servers.
  example: Showing a celebration when you finish a unit is done with JavaScript.

- id: memory
  term: Memory (RAM)
  definition: The computer's fast, short-term workspace for whatever it's busy with right now. It's cleared when the power goes off.
  example: An open browser tab uses memory.

- id: program
  term: Program
  definition: A set of instructions that a computer can run. Also called an app or software.
  example: WhatsApp, Safari and Stack Quest are programs.

- id: sandbox
  term: Sandbox
  definition: A sealed-off area where code can run without being able to touch anything outside it.
  example: Your practice code in Stack Quest runs in a sandbox, so it can't affect your saved progress.

- id: schema
  term: Schema
  definition: A set of rules describing what shape some information must have, used to check it.
  example: The lesson schema says every unit must have a title and take 10 minutes or less.

- id: server
  term: Server
  definition: A computer (or program) that waits for requests and sends back answers, such as web pages or data.
  example: When you open a website, a server somewhere sends your browser the page.

- id: sql
  term: SQL
  definition: Short for "Structured Query Language". The language used to ask a database questions and change what's stored in it.
  example: "SELECT name FROM learners; asks for every learner's name."

- id: storage
  term: Storage
  definition: Where a computer keeps files long term, even when it's switched off, for example an SSD (disk).
  example: Your photos are kept in storage.

- id: test
  term: Test
  definition: A small piece of code that checks other code gives the expected answer, automatically.
  example: "expect(add(2, 3)).toBe(5) checks that add works."

- id: variable
  term: Variable
  definition: A name that holds a value so you can use it later, like a labelled jar.
  example: "let score = 10; creates a variable called score holding 10."

- id: loop
  term: Loop
  definition: Code that repeats a set of instructions, either a fixed number of times or until a condition stops being true. An "endless loop" never stops.
  example: Going through every learner in a list and adding up their XP is a loop.

- id: client
  term: Client
  definition: The program (or device) that asks a server for something. Your browser is a client.
  example: When you open a news site, your phone's browser is the client and the news site's computer is the server.

- id: internet
  term: Internet
  definition: The worldwide network of connected computers, linked by cables, fibre, cell towers and satellites, that lets them send each other data.
  example: Your phone reaches the internet through your mobile network or Wi-Fi.

- id: web
  term: The web
  definition: The collection of web pages and sites you visit with a browser. It's one of many things that run on top of the internet (others include email and WhatsApp).
  example: Wikipedia is part of the web; your WhatsApp messages travel over the internet but aren't the web.

- id: website
  term: Website
  definition: A collection of related web pages under one name, like a book made of pages.
  example: news24.com is a website; each article on it is a web page.

- id: url
  term: URL
  definition: Short for "Uniform Resource Locator". The full address of something on the web, such as a page or a picture.
  example: https://www.example.co.za/about is a URL.

- id: domain-name
  term: Domain name
  definition: The human-friendly name of a website, like example.co.za, which you rent yearly from a registrar.
  example: In https://www.sanparks.org/parks, the domain name is sanparks.org.

- id: ip-address
  term: IP address
  definition: A number that identifies a device on the internet, like a street address for computers.
  example: 104.18.32.7 is an IP address.

- id: dns
  term: DNS
  definition: Short for "Domain Name System". The internet's phone book, which turns a domain name into the IP address of the server to contact.
  example: DNS turns example.co.za into an address like 104.18.32.7.

- id: protocol
  term: Protocol
  definition: An agreed set of rules for how two computers talk to each other, so both understand the conversation.
  example: HTTP is the protocol browsers and web servers use.

- id: http
  term: HTTP
  definition: Short for "HyperText Transfer Protocol". The rules for how a client asks a web server for something and how the server replies.
  example: Your browser sends an HTTP request for a page, and the server sends an HTTP response back.

- id: https
  term: HTTPS
  definition: HTTP with encryption (the S stands for "secure"), so nobody in between can read or change what's sent. Browsers show a padlock.
  example: Banking sites always use HTTPS.

- id: encryption
  term: Encryption
  definition: Scrambling information so only someone with the right key can unscramble and read it.
  example: HTTPS encrypts your password on its way to the server.

- id: request
  term: Request
  definition: A message from a client asking a server for something, or asking it to do something.
  example: "GET /products is a request for the list of products."

- id: response
  term: Response
  definition: The server's reply to a request, with a status code and usually some content.
  example: A response with status 200 and the page's HTML.

- id: status-code
  term: Status code
  definition: A three-digit number at the start of every HTTP response that says how the request went.
  example: 200 means OK, 404 means Not Found, 500 means the server had a problem.

- id: json
  term: JSON
  definition: Short for "JavaScript Object Notation". A simple text format for sending structured data, made of names and values in curly brackets.
  example: '{ "name": "Thandi", "xp": 320 }'

- id: cloud
  term: The cloud
  definition: Computers in someone else's data centre that you rent over the internet, instead of owning and running them yourself.
  example: Your Google Photos backups are stored in the cloud.

- id: data-centre
  term: Data centre
  definition: A building full of servers, with strong power, cooling, security and internet connections.
  example: Several big cloud companies have data centres in Johannesburg and Cape Town.

- id: frontend
  term: Front end
  definition: The part of an app that runs in your browser or phone and that you see and click.
  example: Stack Quest's buttons, pages and progress rings are the front end.

- id: backend
  term: Back end
  definition: The part of an app that runs on servers, out of sight, such as storing data, checking passwords and sending emails.
  example: A shop's back end saves your order and charges your card.

- id: full-stack
  term: Full-stack developer
  definition: A developer who can build both the front end and the back end of an app, including the database.
  example: By the end of Stack Quest, you'll be one.

- id: terminal
  term: Terminal
  definition: An app where you control the computer by typing commands instead of clicking. Also called the command line.
  example: On a Mac, open Spotlight (Command + Space) and type Terminal.

- id: command
  term: Command
  definition: An instruction you type in the terminal. The first word is the command, and what follows are its arguments.
  example: In "mkdir projects", mkdir is the command and projects is the argument.

- id: working-directory
  term: Working directory
  definition: The folder the terminal is currently "standing in". Commands act there unless you give a different path.
  example: "pwd prints the working directory, e.g. /Users/learner."

- id: home-folder
  term: Home folder
  definition: Your personal folder on the computer, holding Desktop, Documents and Downloads. The terminal shortens it to ~.
  example: On a Mac it's /Users/yourname.

- id: code-editor
  term: Code editor
  definition: A program for writing code, like a word processor designed for programming, with colours, auto-complete and error hints.
  example: VS Code is the code editor most web developers use.

- id: extension
  term: Extension
  definition: An add-on that gives a program extra features.
  example: VS Code extensions can add spell-checking or support for new languages.

- id: shortcut
  term: Keyboard shortcut
  definition: A combination of keys that does something instantly, without the mouse.
  example: Command + S saves the file you're editing.

- id: version-control
  term: Version control
  definition: A system that records every change to your files over time, so you can see history, undo mistakes and work with others.
  example: Git is the most popular version control system.

- id: git
  term: Git
  definition: The version control tool almost all developers use. It saves snapshots (commits) of a project's files.
  example: git commit -m "Add contact page" saves a snapshot with a message.

- id: repository
  term: Repository
  definition: A project folder that Git is tracking, including the full history of its changes. Often called a "repo".
  example: Running git init in a folder turns it into a repository.

- id: commit
  term: Commit
  definition: A saved snapshot of your project at one moment, with a message describing what changed.
  example: '"Fix spelling on home page" is a good commit message.'

- id: staging-area
  term: Staging area
  definition: Git's waiting room, holding the changes you've chosen (with git add) to include in your next commit.
  example: git add notes.txt puts notes.txt in the staging area.

- id: github
  term: GitHub
  definition: A website that stores Git repositories online, as a backup and so people can work together. Git is the tool; GitHub is a place to keep the results.
  example: Many open-source projects, like VS Code itself, live on GitHub.

# ---------- Trail 3: HTML and CSS ----------

- id: tag
  term: Tag
  definition: A label in angle brackets that marks where a piece of a web page starts or ends. Most come in pairs, an opening tag and a closing tag with a slash.
  example: "<p> opens a paragraph and </p> closes it."

- id: element
  term: Element
  definition: One complete piece of a web page, an opening tag, its contents and its closing tag together. Elements can sit inside other elements.
  example: "<h1>Sawubona</h1> is a heading element."

- id: attribute
  term: Attribute
  definition: Extra information written inside an opening tag, as a name and a value. It changes or describes the element.
  example: In <a href="https://example.com">, href is an attribute that says where the link goes.

- id: semantic-html
  term: Semantic HTML
  definition: Choosing HTML elements by what the content means (a header, a list, a button) rather than how it looks. It helps screen readers, search engines and other developers.
  example: Using <nav> for a menu instead of a plain <div>.

- id: form
  term: Form
  definition: The part of a page where people type or choose information and send it, made of inputs, labels and a button.
  example: A sign-up page with boxes for your email and password is a form.

- id: accessibility
  term: Accessibility
  definition: Making apps and pages usable by everyone, including people who are blind, deaf, colour-blind or who can't use a mouse. Often shortened to "a11y".
  example: Adding a text description to a photo so a screen reader can read it aloud.

- id: screen-reader
  term: Screen reader
  definition: A program that reads the screen aloud (or on a braille display) for people who can't see it. It relies on well-written HTML.
  example: VoiceOver, built into every Mac and iPhone, is a screen reader.

- id: alt-text
  term: Alt text
  definition: A short written description of an image, given in the alt attribute. Screen readers read it aloud, and it shows if the image can't load.
  example: alt="Table Mountain covered in cloud"

- id: selector
  term: Selector
  definition: The first part of a CSS rule. It picks which elements on the page the rule styles.
  example: h1 selects every main heading. .card selects everything with class="card".

- id: css-property
  term: CSS property
  definition: One thing about an element that CSS can change, such as its colour, size or spacing. It's written as a name, a colon, a value and a semicolon.
  example: "color: green;"

- id: class
  term: Class
  definition: A name you give to HTML elements with the class attribute, so CSS can style all of them together. In CSS, a class selector starts with a dot.
  example: <p class="note"> is styled by the CSS rule .note { }

- id: box-model
  term: Box model
  definition: The idea that every element is a rectangle made of four layers, the content, then padding, then a border, then a margin on the outside.
  example: A framed photo has the photo (content), the mount (padding), the frame (border) and the gap to the next frame on the wall (margin).

- id: specificity
  term: Specificity
  definition: The rule a browser uses to decide which CSS wins when two rules style the same thing. An id beats a class, and a class beats an element name.
  example: "#welcome { color: black } beats .note { color: green } on the same paragraph."

- id: flexbox
  term: Flexbox
  definition: A CSS layout tool that lines elements up in a row or a column and shares out the space between them.
  example: A menu bar with links spread evenly across the top of a page.

- id: css-grid
  term: CSS Grid
  definition: A CSS layout tool that arranges elements into rows and columns, like a table you control.
  example: A photo gallery with three pictures per row.

- id: media-query
  term: Media query
  definition: A CSS condition that applies some rules only when it's true, usually depending on the screen width.
  example: "@media (min-width: 600px) { } only applies on screens 600 pixels wide or more."

- id: responsive-design
  term: Responsive design
  definition: Building pages that rearrange themselves to fit any screen, from a small phone to a wide laptop.
  example: Cards that stack in one column on a phone and sit side by side on a laptop.

- id: pixel
  term: Pixel
  definition: One tiny dot of light on a screen. CSS measures many sizes in pixels, written px.
  example: "padding: 16px; leaves 16 dots of space."
